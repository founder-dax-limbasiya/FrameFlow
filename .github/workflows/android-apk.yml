name: Build FrameFlow Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/native-source.parts/**"
      - "android/script-source-overlay.parts/**"
      - "android/script-fix-overlay.parts/**"
      - "android/local-mnn-overlay/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frameflow-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Test and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout FrameFlow
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android 36 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "cmake;3.31.6" "ndk;30.0.14904198"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Restore native Android project
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/frameflow-source"
          cat android/native-source.parts/*.b64 | base64 --decode > "$RUNNER_TEMP/frameflow-native.tar.xz"
          tar -tJf "$RUNNER_TEMP/frameflow-native.tar.xz"
          tar -xJf "$RUNNER_TEMP/frameflow-native.tar.xz" -C "$RUNNER_TEMP/frameflow-source"
          # Apply the script-to-video native app over the original scaffold.
          mkdir -p "$RUNNER_TEMP/frameflow-script-overlay"
          cat android/script-source-overlay.parts/*.b64 | base64 --decode > "$RUNNER_TEMP/frameflow-script-overlay.tar.xz"
          tar -tJf "$RUNNER_TEMP/frameflow-script-overlay.tar.xz"
          tar -xJf "$RUNNER_TEMP/frameflow-script-overlay.tar.xz" -C "$RUNNER_TEMP/frameflow-source"
          # Apply compile fixes and the native launcher vector icon.
          mkdir -p "$RUNNER_TEMP/frameflow-script-fix-overlay"
          cat android/script-fix-overlay.parts/*.b64 | base64 --decode > "$RUNNER_TEMP/frameflow-script-fix-overlay.tar.xz"
          tar -tJf "$RUNNER_TEMP/frameflow-script-fix-overlay.tar.xz"
          tar -xJf "$RUNNER_TEMP/frameflow-script-fix-overlay.tar.xz" -C "$RUNNER_TEMP/frameflow-source"
          # Overlay the local-only MNN integration and remove the earlier hosted API generator.
          mkdir -p "$RUNNER_TEMP/frameflow-source/frameflow_android/app/src/main/java/com/nezumi_ai/sd"
          cp android/local-mnn-overlay/MnnSdNative.kt "$RUNNER_TEMP/frameflow-source/frameflow_android/app/src/main/java/com/nezumi_ai/sd/MnnSdNative.kt"
          cp android/local-mnn-overlay/LocalImageModelManager.kt "$RUNNER_TEMP/frameflow-source/frameflow_android/app/src/main/java/ai/frameflow/app/LocalImageModelManager.kt"
          cp android/local-mnn-overlay/LocalImageGenerator.kt "$RUNNER_TEMP/frameflow-source/frameflow_android/app/src/main/java/ai/frameflow/app/LocalImageGenerator.kt"
          cp android/local-mnn-overlay/ScriptPlanner.kt "$RUNNER_TEMP/frameflow-source/frameflow_android/app/src/main/java/ai/frameflow/app/ScriptPlanner.kt"
          mkdir -p "$RUNNER_TEMP/frameflow-source/frameflow_android/app/src/test/java/ai/frameflow/app"
          cp android/local-mnn-overlay/ScriptPlannerTest.kt "$RUNNER_TEMP/frameflow-source/frameflow_android/app/src/test/java/ai/frameflow/app/ScriptPlannerTest.kt"
          python3 android/local-mnn-overlay/apply_local_mnn_patch.py "$RUNNER_TEMP/frameflow-source/frameflow_android"
          rm -f "$RUNNER_TEMP/frameflow-source/frameflow_android/app/src/main/java/ai/frameflow/app/OpenModelImageGenerator.kt"
          rm -f "$RUNNER_TEMP/frameflow-source/frameflow_android/app/src/main/java/ai/frameflow/app/AiHordeImageGenerator.kt"
          # API 37 is not yet published in the runner's SDK package feed; use stable API 36 for this build.
          sed -i 's/compileSdk = 37/compileSdk = 36/' "$RUNNER_TEMP/frameflow-source/frameflow_android/app/build.gradle.kts"
          # Compose 1.12+ requires compileSdk 37; use the April 2026 stable BOM for API 36 builds.
          sed -i 's/compose-bom:2026.09.00/compose-bom:2026.04.01/' "$RUNNER_TEMP/frameflow-source/frameflow_android/app/build.gradle.kts"
          sed -i 's/lifecycle-runtime-ktx:2.11.0/lifecycle-runtime-ktx:2.10.0/' "$RUNNER_TEMP/frameflow-source/frameflow_android/app/build.gradle.kts"
          sed -i 's/lifecycle-runtime-compose:2.11.0/lifecycle-runtime-compose:2.10.0/' "$RUNNER_TEMP/frameflow-source/frameflow_android/app/build.gradle.kts"
          sed -i 's/import androidx.media3.effect.Effects/import androidx.media3.transformer.Effects/' "$RUNNER_TEMP/frameflow-source/frameflow_android/app/src/main/java/ai/frameflow/app/MediaExporter.kt"

      - name: Build local MNN image inference libraries
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ninja >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y ninja-build; fi
          NEZUMI_ROOT="$RUNNER_TEMP/nezumi-ai"
          git clone --filter=blob:none --depth 1 --sparse https://github.com/mouse0329/nezumi-ai.git "$NEZUMI_ROOT"
          git -C "$NEZUMI_ROOT" sparse-checkout set mnn-sd-engine
          MNN_ROOT="$RUNNER_TEMP/MNN"
          git clone --depth 1 --branch mouse0329-custom https://github.com/mouse0329/MNN.git "$MNN_ROOT"
          NDK="$ANDROID_HOME/ndk/30.0.14904198"
          MNN_BUILD="$RUNNER_TEMP/mnn-android-arm64"
          ENGINE_BUILD="$RUNNER_TEMP/mnn-sd-android"
          test -f "$MNN_ROOT/CMakeLists.txt"
          test -f "$NDK/build/cmake/android.toolchain.cmake"
          cmake -S "$MNN_ROOT" -B "$MNN_BUILD" -G Ninja -DCMAKE_MAKE_PROGRAM="$(command -v ninja)" -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-30 -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-z,max-page-size=16384" -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON -DMNN_USE_LOGCAT=ON -DMNN_OPENCL=ON -DMNN_SEP_BUILD=OFF -DMNN_BUILD_FOR_ANDROID_COMMAND=ON -DMNN_LOW_MEMORY=ON -DMNN_BUILD_TEST=OFF -DMNN_BUILD_BENCHMARK=OFF -DMNN_BUILD_TOOLS=OFF -DMNN_BUILD_QUANTOOLS=OFF -DMNN_BUILD_CONVERTER=OFF -DMNN_BUILD_TRAIN=OFF -DMNN_BUILD_DEMO=OFF -DMNN_BUILD_LLM=OFF -DMNN_BUILD_DIFFUSION=OFF
          cmake --build "$MNN_BUILD" --target MNN -j2
          test -f "$MNN_BUILD/libMNN.so"
          cmake -S "$NEZUMI_ROOT/mnn-sd-engine" -B "$ENGINE_BUILD" -G Ninja -DCMAKE_MAKE_PROGRAM="$(command -v ninja)" -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-30 -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-z,max-page-size=16384" -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON -DMNN_ROOT="$MNN_ROOT" -DMNN_ANDROID_LIB="$MNN_BUILD/libMNN.so" -DMNN_SD_BUILD_PROBE_CLI=OFF
          cmake --build "$ENGINE_BUILD" --target mnn_sd_engine mnn_sd_jni -j2
          JNI_DEST="$RUNNER_TEMP/frameflow-source/frameflow_android/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$JNI_DEST"
          cp "$MNN_BUILD/libMNN.so" "$JNI_DEST/"
          cp "$ENGINE_BUILD/libmnn_sd_engine.so" "$JNI_DEST/"
          cp "$ENGINE_BUILD/libmnn_sd_jni.so" "$JNI_DEST/"
          ls -lh "$JNI_DEST"/lib*.so

      - name: Upload restored Android source for inspection
        uses: actions/upload-artifact@v4
        with:
          name: frameflow-android-source-inspection
          path: ${{ runner.temp }}/frameflow-source/frameflow_android
          if-no-files-found: error
          retention-days: 1

      - name: Run tests and build debug APK
        working-directory: ${{ runner.temp }}/frameflow-source/frameflow_android
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload installable debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frameflow-ai-debug-apk
          path: ${{ runner.temp }}/frameflow-source/frameflow_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
