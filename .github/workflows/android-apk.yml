name: Build FrameFlow Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/native-source.parts/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frameflow-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Test and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout FrameFlow
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android 37 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Restore native Android project
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/frameflow-source"
          cat android/native-source.parts/*.b64 | base64 --decode > "$RUNNER_TEMP/frameflow-transport.gz"
          # The source tar.gz is gzip-compressed once more for transport; unwrap the outer layer first.
          gzip -dc "$RUNNER_TEMP/frameflow-transport.gz" > "$RUNNER_TEMP/frameflow-native.tar.gz"
          tar -tzf "$RUNNER_TEMP/frameflow-native.tar.gz"
          tar -xzf "$RUNNER_TEMP/frameflow-native.tar.gz" -C "$RUNNER_TEMP/frameflow-source"
          # API 37 is not yet published in the runner's SDK package feed; use stable API 36 for this build.
          sed -i 's/compileSdk = 37/compileSdk = 36/' "$RUNNER_TEMP/frameflow-source/frameflow_android/app/build.gradle.kts"

      - name: Run tests and build debug APK
        working-directory: ${{ runner.temp }}/frameflow-source/frameflow_android
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload installable debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frameflow-ai-debug-apk
          path: ${{ runner.temp }}/frameflow-source/frameflow_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
